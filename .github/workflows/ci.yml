name: ExeBridge CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify ExeBridge source
        run: |
          bash assemble-source.sh /tmp/exebridge.py
          test "$(sha256sum /tmp/exebridge.py | awk '{print $1}')" = "3aed3ff04b6f43ae79757d0ca88c7a058550566be8caf5ccbfe6ca8f49cdfeae"

      - name: Compile-check Python source and patch
        run: python3 -m py_compile /tmp/exebridge.py scripts/patch-0.4.0.py

      - name: Verify multi-distro source structure
        run: python3 tests/test_multidistro_source.py /tmp/exebridge.py

      - name: Syntax-check shell scripts
        run: bash -n install.sh update.sh uninstall.sh bootstrap_umu.sh assemble-source.sh scripts/build-release.sh
