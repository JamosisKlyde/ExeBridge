name: ExeBridge CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify ExeBridge source
        run: |
          bash assemble-source.sh /tmp/exebridge.py
          test "$(sha256sum /tmp/exebridge.py | awk '{print $1}')" = "1ea9474b55f5c569caa62bf3b3e4294a7cc2d82d824f6885fcdf782a62c0c26a"

      - name: Compile-check Python source
        run: python3 -m py_compile /tmp/exebridge.py

      - name: Syntax-check shell scripts
        run: bash -n install.sh update.sh uninstall.sh bootstrap_umu.sh assemble-source.sh
